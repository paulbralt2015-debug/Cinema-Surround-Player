plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cinemasurround.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cinemasurround.player'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '0.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // ExoPlayer uses Android MediaCodec and the standard TV media audio route.
    implementation 'com.google.android.exoplayer:exoplayer:2.9.6'
}
