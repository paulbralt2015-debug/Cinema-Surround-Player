plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cinemasurround.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cinemasurround.player'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // ExoPlayer 2.19.1 uses Android MediaCodec and the TV's standard audio route.
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
}
