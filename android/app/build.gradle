plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cinemasurround.player'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cinemasurround.player'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // ExoPlayer 2.9.6 supports Android API 16+ and negotiates AC-3/E-AC-3
    // HDMI passthrough where the Android TV reports compatible sink capabilities.
    implementation 'com.google.android.exoplayer:exoplayer:2.9.6'
}
